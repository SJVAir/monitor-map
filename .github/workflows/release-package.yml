name: Publish Package to npmjs
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}
      VITE_NREL_KEY: ${{secrets.VITE_NREL_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.x"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: npm ci
      # The browser test project runs component specs in Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # Builds dist/lib, then fails the release if the light entries reach maplibre.
      - run: npm run test:bundle
      # A prerelease (a version with "-") goes to the "next" dist-tag, not "latest".
      - name: Choose dist-tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then
            echo "TAG=--tag next" >> "$GITHUB_ENV"
          else
            echo "TAG=" >> "$GITHUB_ENV"
          fi
      - run: npm publish --access public --provenance $TAG
